<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Password</h2>

    <input
      type="password"
      placeholder="New Password"
      [(ngModel)]="newPassword"
    />

    <input
      type="password"
      placeholder="Confirm Password"
      [(ngModel)]="confirmPassword"
    />

    <button (click)="updatePassword()">Update Password</button>

    <p>{{ message }}</p>
  </div>
</div>
