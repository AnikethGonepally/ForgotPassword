<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back 👋</h2>
    <p class="subtitle">Login to your account</p>

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="username"
      (input)="onInputChange()"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      (input)="onInputChange()"
    />

    <button (click)="login()" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <!-- ✅ FIXED: no !loading condition -->
    <p class="error" *ngIf="errorMessage">
        {{ errorMessage }}
    </p>
    <p class="forgot">
  <span (click)="goToForgotPassword()">Forgot Password?</span>
</p>

    <p class="switch">
      Don’t have an account?
      <span (click)="goToRegister()">Register</span>
    </p>
  </div>
</div>
